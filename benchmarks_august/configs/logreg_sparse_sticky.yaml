seed: 1
N: 5000
out_dir: results

target:
  name: logreg_synthetic
  kwargs:
    n: 300
    p: 5
    sparsity: sparse
    seed: 1
    prior:
      kind: gaussian
      scale: 1.0

sampler:
  name: sticky_boomerang
  kwargs: {}

kappa:
  kind: uniform
  gamma_prior: 0.6
  # slab scale comes from target.meta['prior']['scale'] — no duplication

preprocess:
  method: diagonal
